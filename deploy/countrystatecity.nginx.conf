server {
    listen 80;
    listen [::]:80;
    server_name countrystatecity.tansuasici.com;

    root /opt/countrystatecity/current/web;
    index index.html;
    client_max_body_size 64k;

    access_log /var/log/nginx/countrystatecity.access.log;
    error_log /var/log/nginx/countrystatecity.error.log;

    location = /api {
        proxy_pass http://127.0.0.1:5310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location ^~ /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ~ /\. {
        deny all;
    }
}
