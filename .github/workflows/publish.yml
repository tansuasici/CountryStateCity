name: Publish to NPM

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: self-hosted
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:data-quality
      - run: npm run test:data-quality-regressions
      - run: npm run test:quality-dashboard
      - run: npm run test:web-version-diffs
      - run: npm test
      - run: npm run build:lib
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
      - run: npm run build:mcp
      - run: npm run test:package-size
      - run: npm run test:packed-entrypoints
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
